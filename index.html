<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz día de hacerle el amor a la amistad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff7f2;
    --pink-deep:#d6417a;
    --pink-soft:#ffd9e8;
    --lilac:#b98bd6;
    --ink:#4a2740;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{min-height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 10%, #ffe3ef 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #e7d6ff 0%, transparent 40%),
      radial-gradient(circle at 50% 95%, #fff0d9 0%, transparent 45%),
      var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:3rem 1.25rem 4rem;
    overflow-x:hidden;
    overflow-y:auto;
  }

  h1{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(1.9rem, 8vw, 3.1rem);
    line-height:1.15;
    max-width:14ch;
    margin:0 0 2.5rem;
    color:var(--pink-deep);
    text-shadow: 2px 2px 0 var(--pink-soft);
  }

  .heart-btn{
    background:none;
    border:none;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.6rem;
    padding:.5rem;
    -webkit-tap-highlight-color:transparent;
  }

  .heart-btn svg{
    width:clamp(70px, 22vw, 110px);
    height:auto;
    filter:drop-shadow(0 10px 18px rgba(214,65,122,.35));
    animation:beat 1.3s ease-in-out infinite;
  }

  @keyframes beat{
    0%, 100%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce){
    .heart-btn svg{ animation:none; }
  }

  .heart-btn span{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:1.05rem;
    color:var(--lilac);
    letter-spacing:.01em;
  }

  .reveal{
    max-width:480px;
    width:100%;
    opacity:0;
    height:0;
    overflow:hidden;
    transform:translateY(-12px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .reveal.shown{
    opacity:1;
    height:auto;
    margin-top:2.2rem;
    transform:translateY(0);
  }

  .card{
    background:#fff;
    border-radius:24px;
    padding:1rem 1rem 1.3rem;
    box-shadow: 0 18px 40px -18px rgba(182,62,122,.35), 0 4px 14px rgba(182,62,122,.12);
    border:3px solid var(--pink-soft);
  }
  .card img{
    display:block;
    width:100%;
    height:auto;
    border-radius:16px;
  }
  .card p{
    margin:.9rem 0 0;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    color:var(--lilac);
    font-size:1.05rem;
  }

  .hidden-btn{
    display:none;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#241522;
      --ink:#ffe7f1;
    }
    body:not([data-theme]){
      background:
        radial-gradient(circle at 15% 10%, #3a1c33 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, #2a1c3d 0%, transparent 40%),
        radial-gradient(circle at 50% 95%, #33231a 0%, transparent 45%),
        var(--cream);
    }
    body:not([data-theme]) .card{
      background:#2e1a2a;
      border-color:#5a3350;
    }
  }
</style>
</head>
<body>
